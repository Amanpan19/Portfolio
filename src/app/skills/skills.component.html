<section class="skills-section">
  <div class="skills-header">
    <h2 class="skills-title">
      I SPECIALIZE IN A<br />
      RANGE OF <span class="emoji">💪</span>SKILLS
    </h2>
  </div>

  <div class="skills-grid">
    <div
      class="skill-card"
      *ngFor="let skill of skills"
      [class.active]="skill.id === activeSkill"
      (click)="setActive(skill.id)"
    >
      <!-- Icon -->
      <div class="skill-icon">

        <!-- Front-end -->
        <svg *ngIf="skill.icon === 'frontend'" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="10" width="56" height="44" rx="4" stroke="currentColor" stroke-width="3"/>
          <path d="M14 28L24 36L14 44" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="28" y1="44" x2="44" y2="44" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="12" cy="18" r="2" fill="currentColor"/>
          <circle cx="20" cy="18" r="2" fill="currentColor"/>
          <circle cx="28" cy="18" r="2" fill="currentColor"/>
        </svg>

        <!-- Back-end -->
        <svg *ngIf="skill.icon === 'backend'" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="10" width="56" height="44" rx="4" stroke="currentColor" stroke-width="3"/>
          <path d="M20 30L30 38L20 46" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="4" y1="22" x2="60" y2="22" stroke="currentColor" stroke-width="3"/>
          <circle cx="12" cy="16" r="2" fill="currentColor"/>
          <circle cx="20" cy="16" r="2" fill="currentColor"/>
          <circle cx="28" cy="16" r="2" fill="currentColor"/>
        </svg>

        <!-- Database -->
        <svg *ngIf="skill.icon === 'database'" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="8" width="48" height="14" rx="3" stroke="currentColor" stroke-width="3"/>
          <rect x="8" y="26" width="48" height="14" rx="3" stroke="currentColor" stroke-width="3"/>
          <rect x="8" y="44" width="48" height="14" rx="3" stroke="currentColor" stroke-width="3"/>
          <line x1="18" y1="15" x2="22" y2="15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="18" y1="33" x2="22" y2="33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="18" y1="51" x2="22" y2="51" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

        <!-- Version Control -->
        <svg *ngIf="skill.icon === 'version'" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="20" y1="12" x2="20" y2="52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="44" y1="22" x2="44" y2="52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="20" cy="12" r="5" stroke="currentColor" stroke-width="3"/>
          <circle cx="44" cy="22" r="5" stroke="currentColor" stroke-width="3"/>
          <circle cx="20" cy="52" r="5" stroke="currentColor" stroke-width="3"/>
          <circle cx="44" cy="52" r="5" stroke="currentColor" stroke-width="3"/>
          <path d="M20 22 Q32 22 39 22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>

        <!-- Responsive / API -->
        <svg *ngIf="skill.icon === 'responsive'" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="10" width="40" height="30" rx="3" stroke="currentColor" stroke-width="3"/>
          <rect x="36" y="28" width="24" height="28" rx="3" stroke="currentColor" stroke-width="3"/>
          <line x1="4" y1="52" x2="44" y2="52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="20" y1="52" x2="20" y2="58" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="14" y1="58" x2="34" y2="58" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>

        <!-- UI/UX -->
        <svg *ngIf="skill.icon === 'uiux'" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="52" height="52" rx="4" stroke="currentColor" stroke-width="3"/>
          <line x1="6" y1="20" x2="58" y2="20" stroke="currentColor" stroke-width="3"/>
          <line x1="6" y1="36" x2="58" y2="36" stroke="currentColor" stroke-width="3"/>
          <line x1="22" y1="20" x2="22" y2="58" stroke="currentColor" stroke-width="3"/>
          <rect x="28" y="24" width="24" height="8" rx="2" stroke="currentColor" stroke-width="2.5"/>
          <line x1="28" y1="42" x2="52" y2="42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="28" y1="50" x2="44" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

      </div>

      <h3 class="skill-title">{{ skill.title }}</h3>
      <p class="skill-description">{{ skill.description }}</p>
    </div>
  </div>
</section>
